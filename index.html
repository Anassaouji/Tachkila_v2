<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" src="./js/page-effectif.js"></script>
</head>

<body>

    <header class="bg-[#132238] text-[#F8FAFC] p-4 flex items-center justify-between border-b-2 max-lg:flex-col max-lg:gap-3">
        <!-- Section Gauche : Logo + Titres -->
        <div class="flex items-center space-x-3">
            <!-- Icône / Logo vert -->
            <div class="bg-[#486581] rounded-full p-2 flex items-center justify-center w-10 h-10">
                <img src="./images/ATLAS FC.svg" alt="logo de site">
            </div>

            <!-- Texte TACHKILA / ATLAS FC -->
            <div>
                <h1 class="font-bold text-lg tracking-wide leading-none">TACHKILA</h1>
                <p class="text-xs text-[#94A3B8] font-medium mt-1">ATLAS FC</p>
            </div>
        </div>

        <div class="bg-[#243B53] border border-[#486581] rounded-lg p-1 flex items-center space-x-1">
            <button class="bg-[#2CB1BC] text-[#0F172A] font-semibold text-sm px-4 py-1.5 rounded-md">
                <a href="./index.html">Effectif</a>
            </button>
            <button class="text-[#CBD5E1] font-semibold text-sm px-4 py-1.5 hover:text-[#F8FAFC]">
                <a href="./pages/composition.html">Composition</a>
            </button>
            <button class="text-[#CBD5E1] font-semibold text-sm px-4 py-1.5 hover:text-[#F8FAFC]">
                <a href="./pages/matchs.html">Matchs</a>
            </button>
        </div>


        <div class="flex items-center space-x-4 text-xs font-bold">
            <div class="flex items-center space-x-1.5">
                <span class="w-2.5 h-2.5 bg-[#FBBF24] rounded-full"></span>
                <span>GB</span>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="w-2.5 h-2.5 bg-[#60A5FA] rounded-full"></span>
                <span>DEF</span>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="w-2.5 h-2.5 bg-[#34D399] rounded-full"></span>
                <span>MIL</span>
            </div>
            <div class="flex items-center space-x-1.5">
                <span class="w-2.5 h-2.5 bg-[#FB7185] rounded-full"></span>
                <span>ATT</span>
            </div>
        </div>
    </header>

    <main class="bg-[#0F172A] text-[#F8FAFC] p-20 max-lg:p-4">
        <section class="">
            <div class="flex justify-end mb-4">
                <button class="btn-ajout bg-[#2CB1BC] !p-3  text-[#0F172A] rounded-[10px] w-[20%] max-lg:w-auto">Ajouter un
                    joueur</button>
            </div>
            <div class="p-4 flex bg-[#1E293B] rounded-[10px] items-center max-lg:flex-col max-lg:gap-3">
                <div class="w-[75%] mr-5 max-lg:w-full max-lg:mr-0">
                    <input type="search" class="rounded-[6px] h-[40px] w-full border border-[#486581] outline-none px-2"
                        placeholder="Recherche un joueur par nom..." name="search">
                </div>
                <div class="flex bg-[#0F172A] gap-6 rounded-[10px] max-lg:flex-wrap max-lg:justify-center max-lg:gap-0">
                    <button class="btn-tous bg-[#16636D] p-2 m-1 rounded-[10px]">Tous</button>
                    <button class="btn-gb bg-[#483710] p-2 m-1 rounded-[10px]">GB</button>
                    <button class="btn-def bg-[#1B3557] p-2 m-1 rounded-[10px]">DEF</button>
                    <button class="btn-mil bg-[#134235] p-2 m-1 rounded-[10px]">MIL</button>
                    <button class="btn-att bg-[#512635] p-2 m-1 rounded-[10px]">ATT</button>
                </div>
            </div>
            <article class="article h-[45vh] max-xl:h-auto">

            </article>
            <div class="flex justify-between items-center mt-10 max-md:flex-col max-md:gap-3">
                <div>
                    <p>
                        Affichage de <span class="parPage">8</span> sur <span class="nombreJoueurs">14</span> joueurs
                    </p>
                </div>
                <div class="flex items-center gap-[8px]">
                    <button class="precedent rounded-[5px] border border-[#486581] px-2 py-1 bg-[#243B53] cursor-pointer">Precedent</button>
                    <p class="info-page"> Page <span class="page">1</span> / <span class="nPage">2 </span></p>
                    <button class="suivant rounded-[5px] border border-[#486581] px-2 py-1 bg-[#243B53] cursor-pointer">Suivant</button>
                </div>
            </div>
            <!-- modale ---------------------------------modale-------------->
            <div class="hidden modal-ajout bg-[#1E293B] rounded-[10px] z-20 fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 xl:w-[30%] 
                    lg:w-[40%] md:w-1/2 max-md:w-11/12 max-lg:max-h-dvh max-lg:overflow-y-auto 
                    ">
                <div class="!p-4">
                    <div class="flex justify-between !mb-5">
                        <p>Ajouter un joueur</p>
                        <button class="btn-hidden">⨉</button>
                    </div>
                    <form id="monForm">
                        <div class="flex flex-col w-full">
                            <label for="nom">Nom complet</label>
                            <input type="text" placeholder="Ex: ANASS AOUJI" id="nom"
                                class="border-2 rounded-[4px] !p-1 bg-[#243B53]">
                            <span class="text-[#FF9DA9] text-sm error-name"></span>
                        </div>
                        <!-- post et numero -->
                        <div class="!mt-7 flex w-full justify-between items-center mb-6">
                            <!-- numero -->
                            <div class="flex flex-col w-[48%]">
                                <label for="num">Numéro (1 à 99)</label>
                                <input type="number" name="numero" id="num" placeholder="EX.7"
                                    class="border-1 rounded-[8px] !px-2 bg-[#243B53] h-[32px]">
                                <span class="text-[#FF9DA9] text-sm error-number"></span>
                            </div>
                            <!-- post -->
                            <div class="w-[48%]">
                                <label class="block" for="post">Post</label>
                                <select name="post" id="post"
                                    class="border rounded-[8px] w-[100%] text-center bg-[#243B53] h-[32px]">
                                    <option value="">Choisir un post</option>
                                    <option value="GB">Gardien</option>
                                    <option value="DEF">Deffenseur</option>
                                    <option value="MIL">Milieu</option>
                                    <option value="ATT">Attaque</option>
                                </select>
                                <span class="text-[#FF9DA9] text-sm error-post"></span>
                            </div>
                        </div>
                        <!-- age et status -->
                        <div class="!mt-7 flex w-full justify-between items-center mb-10">
                            <!-- Age -->
                            <div class="flex flex-col w-[48%]">
                                <label for="age">Age </label>
                                <input type="number" name="age" id="age" placeholder="EX.24"
                                    class="border-1 rounded-[8px] !px-2 bg-[#243B53] h-[32px]">
                                <span class="text-[#FF9DA9] text-sm error-age"></span>
                            </div>
                            <!-- Status -->
                            <div class="w-[48%]">
                                <label class="block" for="status">Status</label>
                                <select name="status" id="status"
                                    class="border rounded-[8px] w-[100%] text-center bg-[#243B53] h-[32px]">
                                    <option value="">Choisir un status</option>
                                    <option value="En forme">En forme</option>
                                    <option value="Blesse">Blesse</option>
                                </select>
                                <span class="text-[#FF9DA9] text-sm error-status"></span>
                            </div>
                        </div>
                        <div class="flex justify-end gap-2">
                            <button type="reset"
                                class="btn-annule bg-[#243B53] !py-1 !px-2 rounded-[10px]">Annuler</button>
                            <button class="bg-[#16636D] !py-1 !px-2 rounded-[10px]">Ajouter</button>
                        </div>
                    </form>
                </div>
            </div>
            <!-- Modal de confirmation de suppression -->
            <div id="modalDelete" class="fixed z-50 left-[30%] top-[20%] hidden items-center justify-center max-lg:left-0 max-lg:right-0 max-lg:top-0 max-lg:h-dvh max-lg:overflow-y-auto">

                <div class="w-full max-w-md rounded-xl bg-[#1E293B] !p-6 !mx-4 max-lg:max-h-dvh max-lg:overflow-y-auto">

                    <!-- Titre -->
                    <h2 class="text-xl font-bold text-[#F8FAFC] !mb-3">
                        Confirmer la suppression
                    </h2>

                    <!-- Message -->
                    <p class="text-[#F8FAFC] !mb-6">
                        Êtes-vous sûr de vouloir supprimer ce joueur ?
                        Cette action est irréversible.
                    </p>

                    <!-- Boutons -->
                    <div class="flex justify-end gap-3">

                        <button id="cancelDelete" type="button" class="rounded-lg border border-[#486581] !px-4 !py-2
                           text-[#F8FAFC] hover:bg-[#243B53]">
                            Annuler
                        </button>

                        <button id="confirmDelete" type="button" class="rounded-lg bg-[#8E3347] !px-4 !py-2
                           text-[#F8FAFC] hover:bg-[#76283A]">
                            Confirmer
                        </button>

                    </div>
                </div>
            </div>
        </section>

    </main>






</body>

</html>
